version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # @typescript-eslint/parser currently requires TypeScript < 6.1.0.
      # Remove this limit when the parser adds support for newer releases.
      - dependency-name: typescript
        versions:
          - '>=6.1.0'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
